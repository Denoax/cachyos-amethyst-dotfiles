name: Validate source and isolated installation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  files-and-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the portfolio-based showcase
        run: |
          npm ci --prefix site --ignore-scripts --no-audit --no-fund
          npm --prefix site run build
      - name: Fetch checksum-verified chezmoi
        run: python3 tools/bootstrap-chezmoi --destination .build/tools
      - name: Source checks
        run: python3 tools/check
      - name: Installer isolation, idempotence and failure recovery
        env:
          CHEZMOI: ${{ github.workspace }}/.build/tools/chezmoi
        run: python3 -B -m unittest discover -s tests -v
      - name: Developer test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gdb openjdk-21-jdk python-is-python3
          ci_jdk=$(update-java-alternatives --list | awk '$1 ~ /21/ {print $3; exit}')
          test -n "$ci_jdk"
          echo "$ci_jdk/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$ci_jdk" >> "$GITHUB_ENV"
      - name: CP runner regressions
        run: python3 -B vscode/workspace/tools/verify.py
